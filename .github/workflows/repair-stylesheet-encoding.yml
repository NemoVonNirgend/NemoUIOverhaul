name: Repair stylesheet encoding

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nemo-ui-stylesheet-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repair dependency
        run: python -m pip install --disable-pip-version-check ftfy==6.3.1

      - name: Repair stylesheet and retire fallback
        run: python scripts/fix_mojibake.py

      - name: Validate JavaScript and repository tests
        run: |
          node --check index.js
          npm test
          git diff --check

      - name: Commit repaired source
        run: |
          if git diff --quiet; then
            echo 'Repository is already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair corrupted Unicode in UI stylesheet'
          git push origin HEAD:main
