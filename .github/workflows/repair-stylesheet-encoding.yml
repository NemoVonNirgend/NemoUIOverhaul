name: Repair stylesheet encoding

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: nemo-ui-stylesheet-repair
  cancel-in-progress: false

jobs:
  repair:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.issue.title == '[maintenance] Repair NemoUI stylesheet encoding'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install repair dependency
        run: python -m pip install --disable-pip-version-check ftfy==6.3.1

      - name: Repair stylesheet and retire fallback
        run: python scripts/fix_mojibake.py

      - name: Validate JavaScript and repository tests
        run: |
          node --check index.js
          npm test
          git diff --check

      - name: Commit repaired source
        id: commit
        run: |
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Repository is already clean.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Repair corrupted Unicode in UI stylesheet'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Report completion on maintenance issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          CHANGED: ${{ steps.commit.outputs.changed }}
        run: |
          if [ "$CHANGED" = 'true' ]; then
            message='Completed the full stylesheet repair, removed the temporary override, and pushed the clean source to main.'
          else
            message='The repair completed successfully; the repository was already clean.'
          fi
          gh issue comment "$ISSUE_NUMBER" --body "$message"
          gh issue close "$ISSUE_NUMBER" --reason completed
